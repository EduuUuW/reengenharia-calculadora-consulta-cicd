name: Pipeline de Evolucao Segura (CI/CD)

on:
  push:
    tags:
      - 'v*'

jobs:
  analise_codigo_e_seguranca:
    name: SonarCloud & Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        run: mvn -B verify

      - name: Analise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Trivy - varredura do codigo e dependencias
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  build_and_push_docker:
    name: Build, Scan da Imagem e Push para Docker Hub
    needs: analise_codigo_e_seguranca
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: sistema-reengenheirado:${{ github.ref_name }}

      - name: Trivy - varredura da imagem Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sistema-reengenheirado:${{ github.ref_name }}
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sistema-reengenheirado:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/sistema-reengenheirado:latest